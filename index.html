<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocket Arena 3D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="score"><b id="s0">0</b><span id="clock">2:00</span><b id="s1">0</b></div>
  <div id="boost"><i id="bf"></i><span id="bt">34</span></div>
  <div id="cam">Chase cam (C)</div>
  <div id="msg"></div>
  <div id="menu">
    <h1 id="mt">ROCKET ARENA 3D</h1>
    <div class="opts"><span>Match</span><button data-mode="1">1v1</button><button data-mode="2">2v2</button><button data-mode="3">3v3</button></div>
    <div class="opts"><span>Bots</span><button data-diff="0">Easy</button><button data-diff="1">Medium</button><button data-diff="2">Hard</button></div>
    <p>Drive <b>W A S D</b> or arrows &nbsp; Jump / flip <b>Space</b> &nbsp; Boost <b>Shift</b> &nbsp; Camera <b>C</b> &nbsp; Drift <b>E</b> &nbsp; Mute <b>M</b></p>
    <p>In the air: W/S tilt the nose, A/D turn. Press Space again with a direction to flip.</p>
    <p class="go" id="go">Press Enter or click to kick off</p>
  </div>
  <canvas id="mini" width="120" height="156"></canvas>
</div>
<!-- Three.js r149 from a CDN; falls back to lib/three.min.js if offline -->
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>window.THREE || document.write('<script src="lib/three.min.js"><\/script>')</script>
<script src="game.js"></script>
</body>
</html>
