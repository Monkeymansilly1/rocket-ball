name: Rocket Ball checks
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check game.js
      - name: Physics regression checks
        run: node tests/physics-smoke.js
      - name: Browser gameplay smoke check
        run: node tests/browser-smoke.js
