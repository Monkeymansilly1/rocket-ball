name: Rocket Ball checks
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check game.js
      - name: Physics regression checks
        run: node tests/physics-smoke.js
      - name: Wall, ceiling and wall-jump regression checks
        run: node tests/wall-physics.test.js
      - name: AI steering and pursuit regression checks
        run: node tests/ai-regression.test.js
      - name: Stadium, audio, replay and control regression checks
        run: |
          node tests/scene-utils.test.js
          node tests/goal-effects.test.js
          node tests/match-clock.test.js
          node tests/aerial-controls.test.js
          node tests/flip-physics.test.js
          node tests/replay.test.js
          node tests/car-audio.test.js
          node tests/goal-anthems.test.js
          node tests/ball-camera.test.js
          node tests/car-recovery.test.js
          node tests/landing.test.js
          node tests/mini-crowd.test.js
          node tests/scorpion-body.test.js
          node tests/nexto.test.js
      - name: Browser gameplay smoke check
        run: node tests/browser-smoke.js
